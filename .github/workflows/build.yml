name: Ritchad AI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Ritchad AI
        uses: actions/checkout@v4

      - name: Create Ritchad AI package
        run: |
          git archive --format=zip --output=Ritchad-AI.zip HEAD

      - name: Upload Ritchad AI
        uses: actions/upload-artifact@v4
        with:
          name: Ritchad-AI
          path: Ritchad-AI.zip