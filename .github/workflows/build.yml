name: Ritchad AI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "Ritchad AI build started"
          ls -la

      - name: Create build package
        run: |
          mkdir -p release
          cp -r . release/
          rm -rf release/.git
          rm -rf release/release

      - name: Upload Ritchad AI
        uses: actions/upload-artifact@v4
        with:
          name: Ritchad-AI
          path: release