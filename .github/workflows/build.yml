name: Build Ritchad AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p build
          cp -r . build/
          rm -rf build/.git build/.github

      - name: Upload Ritchad AI
        uses: actions/upload-artifact@v4
        with:
          name: ritchad-ai
          path: build/